name: Verify public examples
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python -m examples.recipe_constraints
      - run: python -m examples.offline_deletions
